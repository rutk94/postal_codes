[tool.poetry]
name = "codes"
version = "0.1.0"
description = ""
authors = ["patryk <gryzabawy@o2.pl>"]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.2.3"
pytest = "^8.3.5"
ruff = "^0.11.2"
mypy = "^1.15.0"
python-dotenv = "^1.0.1"
pgeocode = "^0.5.0"

[tool.poetry.dev-dependencies]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff.lint]
extend-select = ["C4", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.mypy]
allow_redefinition = true

[[tool.mypy.overrides]]
module = ["pgeocode.*"]
follow_untyped_imports = true
#ignore_missing_imports = true